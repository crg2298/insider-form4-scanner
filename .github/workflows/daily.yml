name: Hourly Insider & Analyst Scanner

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scanner
        env:
          LOOKBACK_HOURS: "336"
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scanner.py

      - name: Commit and push site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/state.json
          git commit -m "Hourly update" || echo "No changes"
          git push
